<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Content-Security-Policy: blindaje anti-inyeccion/XSS. Solo se permite
         ejecutar codigo propio (self); cualquier script inyectado por un
         atacante queda bloqueado. Las conexiones de datos se limitan a Supabase
         (HTTPS/WSS). Sin costo de rendimiento.
         El marcador de huella que va en script-src es la del script en línea del tema (más abajo,
         #tv-tema): vite.config.ts la calcula sola al compilar, no hay que tocarla a mano. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-TEMA'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://huggingface.co https://*.huggingface.co https://*.hf.co https://cdnjs.cloudflare.com https://cdn.jsdelivr.net data: blob:; media-src 'self' blob: data:; worker-src 'self' blob:;" />

    <!-- TEMA ANTES DEL PRIMER DIBUJO. Sin esto la página se pintaba clara hasta que llegaba el
         JavaScript (varios cientos de ms) y recién ahí pasaba a oscura: un destello de otro color
         al entrar. Es en línea a propósito (un archivo aparte sería una petición más que bloquea el
         dibujo). Hace LO MISMO que temaInicial/aplicarTema/iniciarVidrio de src/utils/tema.ts: si
         cambias una, cambia la otra. -->
    <script id="tv-tema">
      (function () {
        try {
          var raiz = document.documentElement;
          var guardado = null;
          try { guardado = localStorage.getItem('technoverse_tema'); } catch (e) { /* sin preferencia guardada */ }
          var oscuro = guardado === 'oscuro' ||
            (guardado !== 'claro' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (oscuro) raiz.classList.add('dark');
          raiz.style.colorScheme = oscuro ? 'dark' : 'light';

          var sinVidrio = false;
          try {
            var v = localStorage.getItem('technoverse_sin_vidrio');
            if (v === '1') sinVidrio = true;
            if (v !== '0') {
              var mem = navigator.deviceMemory;
              var telefono = window.matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 820;
              if (telefono || (typeof mem === 'number' && mem > 0 && mem <= 2)) sinVidrio = true;
            }
          } catch (e) { /* sin señal: se queda con el vidrio */ }
          // Paleta de la marca. Si el Worker ya dejó `data-paleta` en la etiqueta raíz, esa manda (es la
          // más fresca); si no (APK, desarrollo), la última que este aparato conoció. Ver utils/paleta.ts.
          try {
            if (!raiz.getAttribute('data-paleta')) {
              var pal = localStorage.getItem('technoverse_paleta');
              if (pal === 'oceano' || pal === 'atardecer' || pal === 'orquidea') raiz.setAttribute('data-paleta', pal);
            }
          } catch (e) { /* sin paleta recordada: Esmeralda */ }
          raiz.classList.toggle('sin-vidrio', sinVidrio);
          var memoria = navigator.deviceMemory;
          raiz.classList.toggle('vidrio-ligero', !sinVidrio && typeof memoria === 'number' && memoria > 0 && memoria <= 4);
        } catch (e) { /* sin acceso: queda el tema claro de siempre y main.tsx lo reintenta */ }
      })();
    </script>

    <title>Technoverse Costa Rica — Tienda de Tecnología y Reparaciones</title>
    <meta name="description" content="Technoverse Costa Rica: tienda de tecnología y taller de reparaciones con garantía legal. Compra segura con SINPE Móvil y tarjeta, y facturación electrónica conforme a Hacienda." />
    <meta name="application-name" content="Technoverse Costa Rica" />
    <meta name="apple-mobile-web-app-title" content="Technoverse" />
    <meta name="theme-color" content="#0f172a" />
    <!-- "Agregar a inicio" en iOS Safari: sin esto, el ícono del acceso
         directo abre igual el sitio, pero DENTRO de Safari (con su barra de
         direcciones y botones). Con `apple-mobile-web-app-capable` abre a
         pantalla completa, como una app instalada — es lo que hace viable
         usar esto en iPhone sin pasar por la App Store ni una cuenta de
         Apple Developer: Face ID ya funciona en ese modo por WebAuthn (ver
         src/utils/biometria.ts), sin necesitar el envoltorio nativo. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Open Graph (vista previa al compartir el enlace) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Technoverse Costa Rica" />
    <meta property="og:title" content="Technoverse Costa Rica — Tienda de Tecnología y Reparaciones" />
    <meta property="og:description" content="Tienda de tecnología y taller de reparaciones con garantía legal en Costa Rica. Compra segura con SINPE Móvil y tarjeta, y facturación electrónica conforme a Hacienda." />
    <meta property="og:image" content="https://technoverse-cr.technoversecr.workers.dev/logo.png" />
    <meta property="og:url" content="https://technoverse-cr.technoversecr.workers.dev" />
    <meta property="og:locale" content="es_CR" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Technoverse Costa Rica — Tienda de Tecnología y Reparaciones" />
    <meta name="twitter:description" content="Tienda de tecnología y taller de reparaciones con garantía legal en Costa Rica." />
    <meta name="twitter:image" content="https://technoverse-cr.technoversecr.workers.dev/logo.png" />
    <!-- SIN aro ni indicador de carga, a propósito: el dueño no lo quiere al entrar (2026-10-14:
         «para eso ya carga el navegador de Chrome naturalmente»). Mientras llega el JavaScript la
         página es solo el fondo del tema. Lo único que queda es la red de seguridad de
         public/arranque.js: si la app no llega a armar su primera pantalla, convierte el
         contenedor #tv-arranque (abajo) en un aviso con qué hacer. -->
  </head>
  <body>
    <div id="root">
      <div id="tv-arranque" role="status" aria-label="Cargando"></div>
    </div>
    <script src="/arranque.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
