name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cachea ~/.npm entre corridas: sin esto cada deploy vuelve a
          # descargar todas las dependencias desde cero.
          cache: npm

      # `npm ci` instala EXACTAMENTE las versiones fijadas en
      # package-lock.json, así que dos deploys del mismo commit producen el
      # mismo bundle. Es lo que se quiere en producción y por eso va primero.
      #
      # PERO `npm ci` se niega a instalar si package.json y el lock no
      # coinciden, y este proyecto se mantiene subiendo archivos a mano
      # desde un teléfono: al agregar una dependencia no hay forma de
      # regenerar el lock, y el deploy se caía entero con
      # "package.json and package-lock.json are not in sync".
      #
      # El respaldo `npm install` resuelve esa situación y de paso deja el
      # lock actualizado dentro del runner. Se pierde la reproducibilidad
      # exacta SOLO en ese caso; mientras el lock esté al día, manda `npm ci`.
      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web app
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: '4'
