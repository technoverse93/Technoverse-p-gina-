name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cachea ~/.npm entre corridas: sin esto cada deploy vuelve a
          # descargar todas las dependencias desde cero.
          cache: npm

      # `npm ci` en vez de `npm install`: instala EXACTAMENTE las versiones
      # fijadas en package-lock.json. `npm install` puede resolver versiones
      # nuevas por su cuenta, así que dos deploys del mismo commit podían
      # producir bundles distintos — justo lo que no se quiere en producción.
      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          wranglerVersion: '4'
