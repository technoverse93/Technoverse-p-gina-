name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # La carpeta android/ no vive en el repositorio: la genera `cap add`
      # en cada compilación, así que su AndroidManifest.xml nace de cero y
      # cualquier permiso que se le agregue a mano se pierde. Por eso el
      # permiso de ubicación se inyecta aquí, después de generarlo.
      #
      # Para qué: el Centro de Ciberseguridad guarda la ubicación real del
      # GPS cuando entra una cuenta administrativa y la persona autoriza el
      # permiso. Sin esta línea en el manifiesto, el navegador interno de la
      # APK ni siquiera puede preguntar, y en el celular solo quedaría la
      # ubicación por IP (que apenas acierta la ciudad).
      #
      # Se comprueba que no esté ya puesto, para que el paso sea repetible.
      - name: Declarar permisos de ubicación, biometría, almacenamiento y cámara en el manifiesto
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if grep -q "ACCESS_FINE_LOCATION" "$MANIFEST" && grep -q "USE_BIOMETRIC" "$MANIFEST" && grep -q "WRITE_EXTERNAL_STORAGE" "$MANIFEST" && grep -q "permission.CAMERA" "$MANIFEST" && grep -q "permission.RECORD_AUDIO" "$MANIFEST"; then
            echo "El permiso ya estaba declarado; no se toca nada."
          else
            python3 - "$MANIFEST" <<'PY'
          import sys
          ruta = sys.argv[1]
          texto = open(ruta, encoding='utf-8').read()
          permisos = (
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
              '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n'
              # Huella / rostro. USE_BIOMETRIC es el permiso moderno;
              # USE_FINGERPRINT lo necesitan los Android anteriores al 9,
              # que todavía circulan bastante en Costa Rica.
              '    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n'
              '    <uses-permission android:name="android.permission.USE_FINGERPRINT" />\n'
              # `required=false` a propósito: un teléfono sin lector debe
              # poder instalar la aplicación igual y entrar con contraseña.
              '    <uses-feature android:name="android.hardware.fingerprint" android:required="false" />\n'
              # Para @capacitor/filesystem al guardar el PDF de la factura en
              # Directory.Documents. `maxSdkVersion="32"` a propósito: desde
              # Android 13 (API 33) escribir en Documentos vía el plugin ya no
              # necesita este permiso —pedirlo igual ahí solo asustaría con un
              # diálogo de más—, pero los equipos con Android 9-12 que
              # circulan en Costa Rica sí lo requieren.
              '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
              # Cámara: el recuadro PiP del Hub de supervisión. Sin esta
              # línea el WebView de la APK ni siquiera puede PREGUNTAR, y
              # getUserMedia falla en seco aunque en la web funcione.
              #
              # Android pide este permiso UNA sola vez por instalación y lo
              # recuerda para siempre; si se reinstala la APK, vuelve a
              # preguntarlo una vez (eso lo decide el sistema operativo, no
              # la aplicación).
              '    <uses-permission android:name="android.permission.CAMERA" />\n'
              # `required=false`: un equipo sin cámara debe poder instalar
              # la aplicación igual y usar todo lo demás.
              '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
              '    <uses-feature android:name="android.hardware.camera.front" android:required="false" />\n'
              # Micrófono: las NOTAS DE VOZ del chat (ver grabadorVoz.ts).
              # Sin esta línea, `getUserMedia({audio:true})` falla en seco
              # dentro del WebView aunque en la web del navegador funcione,
              # exactamente igual que pasaba con la cámara.
              #
              # El Hub de supervisión sigue transmitiendo vídeo con
              # `audio: false`: este permiso es SOLO para que la persona
              # grabe una nota de voz cuando ella lo decide.
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
              # `required=false`: un equipo sin micrófono debe poder
              # instalar la aplicación igual y usar todo lo demás.
              '    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n'
              '</manifest>'
          )
          if '</manifest>' not in texto:
              raise SystemExit('No se encontró el cierre </manifest>: el manifiesto no tiene el formato esperado.')
          texto = texto.replace('</manifest>', permisos, 1)
          open(ruta, 'w', encoding='utf-8').write(texto)
          print('Permisos de ubicación, biometría y almacenamiento agregados al manifiesto.')
          PY
          fi
          echo "--- permisos declarados ---"
          grep "uses-permission" "$MANIFEST"

      # PANTALLA COMPLETA NATIVA (MediaProjection + WebRTC), solo Android
      # ---------------------------------------------------------------
      # android/ nace de cero en cada corrida (ver la nota de arriba), así
      # que el plugin nativo que le da al Superadmin la pantalla REAL del
      # sistema operativo en Android —no el espejo del DOM, que ya
      # funciona en todos lados— vive versionado en `native-android/` y se
      # copia aquí, después de generar el proyecto.
      #
      # Hace falta agregar: (1) el plugin de Gradle de Kotlin, porque el
      # proyecto que genera Capacitor no lo trae por defecto y el plugin
      # nativo está en Kotlin; (2) la librería WebRTC nativa de Android,
      # para hablar el mismo protocolo de señalización (Supabase Realtime)
      # que ya usa la pantalla completa de escritorio; (3) los permisos y
      # el <service> con foregroundServiceType="mediaProjection" que
      # Android exige desde la versión 14 — sin esto, MediaProjection
      # lanza una excepción en cuanto se intenta usar.
      #
      # La notificación permanente que ese servicio muestra mientras
      # transmite NO es opcional: la exige el sistema operativo para
      # cualquier app que use MediaProjection, no es una decisión de esta
      # aplicación y no se puede ocultar.
      - name: Instalar el plugin nativo de pantalla completa (MediaProjection + WebRTC)
        run: |
          PAQUETE=android/app/src/main/java/com/technoverse/admin
          cp native-android/PantallaNativaPlugin.kt "$PAQUETE/PantallaNativaPlugin.kt"
          cp native-android/CapturaPantallaService.kt "$PAQUETE/CapturaPantallaService.kt"
          cp native-android/MainActivity.java "$PAQUETE/MainActivity.java"

          python3 - <<'PY'
          # --- Plugin de Kotlin en el proyecto raíz ---
          ruta = 'android/build.gradle'
          texto = open(ruta, encoding='utf-8').read()
          if 'kotlin-gradle-plugin' not in texto:
              marca = "classpath 'com.google.gms:google-services:4.4.4'"
              if marca not in texto:
                  raise SystemExit('No se encontró el classpath de google-services en android/build.gradle.')
              texto = texto.replace(
                  marca,
                  marca + "\n        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20'",
                  1,
              )
              open(ruta, 'w', encoding='utf-8').write(texto)
              print('Plugin de Gradle de Kotlin agregado a android/build.gradle.')
          else:
              print('El plugin de Kotlin ya estaba declarado en android/build.gradle; no se toca nada.')

          # --- Kotlin aplicado + dependencia de WebRTC en el módulo de la app ---
          ruta = 'android/app/build.gradle'
          texto = open(ruta, encoding='utf-8').read()

          if "apply plugin: 'kotlin-android'" not in texto:
              marca = "apply plugin: 'com.android.application'"
              if marca not in texto:
                  raise SystemExit("No se encontró \"apply plugin: 'com.android.application'\" en android/app/build.gradle.")
              texto = texto.replace(marca, marca + "\napply plugin: 'kotlin-android'", 1)
              print('Plugin de Kotlin aplicado en android/app/build.gradle.')
          else:
              print('El plugin de Kotlin ya estaba aplicado en android/app/build.gradle; no se toca nada.')

          if 'webrtc-sdk' not in texto:
              marca = "implementation project(':capacitor-android')"
              if marca not in texto:
                  raise SystemExit('No se encontró la dependencia de capacitor-android en android/app/build.gradle.')
              texto = texto.replace(
                  marca,
                  marca + "\n    implementation 'io.github.webrtc-sdk:android:125.+'",
                  1,
              )
              print('Dependencia de WebRTC agregada a android/app/build.gradle.')
          else:
              print('La dependencia de WebRTC ya estaba declarada en android/app/build.gradle; no se toca nada.')

          open(ruta, 'w', encoding='utf-8').write(texto)
          PY

          python3 - <<'PY'
          # --- Permisos de MediaProjection y el <service> en el manifiesto ---
          ruta = 'android/app/src/main/AndroidManifest.xml'
          texto = open(ruta, encoding='utf-8').read()

          if 'FOREGROUND_SERVICE_MEDIA_PROJECTION' not in texto:
              permisos = (
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />\n'
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
                  '</manifest>'
              )
              if '</manifest>' not in texto:
                  raise SystemExit('No se encontró el cierre </manifest>.')
              texto = texto.replace('</manifest>', permisos, 1)
              print('Permisos de MediaProjection declarados en el manifiesto.')
          else:
              print('Los permisos de MediaProjection ya estaban declarados; no se toca nada.')

          if 'CapturaPantallaService' not in texto:
              servicio = (
                  '        <service\n'
                  '            android:name=".CapturaPantallaService"\n'
                  '            android:foregroundServiceType="mediaProjection"\n'
                  '            android:exported="false" />\n'
                  '    </application>'
              )
              if '</application>' not in texto:
                  raise SystemExit('No se encontró el cierre </application>.')
              texto = texto.replace('</application>', servicio, 1)
              print('<service> de CapturaPantallaService declarado en el manifiesto.')
          else:
              print('El <service> ya estaba declarado; no se toca nada.')

          open(ruta, 'w', encoding='utf-8').write(texto)
          PY

          echo "--- android/app/build.gradle (fragmento) ---"
          grep -n "kotlin\|webrtc" android/app/build.gradle
          echo "--- AndroidManifest.xml (fragmento) ---"
          grep -n "FOREGROUND_SERVICE\|CapturaPantallaService" android/app/src/main/AndroidManifest.xml

      # Ícono del lanzador con el logo oficial de la tienda, en vez del
      # robot de Capacitor por defecto. Igual que el manifiesto de arriba:
      # android/ nace de cero en cada corrida, así que los mipmap/ que
      # `cap add` generó con el ícono por defecto se SOBRESCRIBEN aquí,
      # después de crearse.
      #
      # Los dos PNG maestros (resources/android-icon/) SÍ viven en el
      # repositorio — a diferencia de android/, son la fuente de verdad
      # que no se puede regenerar sola:
      #   - legacy-master.png: el cuadrado completo (fondo marino + marca
      #     dorada), tal cual public/logo.png, en alta resolución. Sirve
      #     para el ícono clásico (pre-Android 8 / API 26) en sus 5
      #     densidades.
      #   - foreground-master.png: SOLO la marca dorada, con el fondo
      #     marino recortado a transparencia (croma-key), reescalada y
      #     centrada dentro del círculo de 66dp de "zona segura" del
      #     ícono adaptativo de Android (108dp de lienzo total). Sin ese
      #     margen, una máscara circular u otra forma de lanzador le corta
      #     las puntas a la marca.
      # El color de fondo del ícono adaptativo (#031837) es el mismo
      # marino exacto de public/logo.png, muestreado directamente del
      # archivo — no aproximado a mano — para que no haya ninguna costura
      # de color entre el fondo y la marca.
      - name: Generar el ícono del lanzador con el logo de la tienda
        run: |
          python3 -m pip install --quiet --disable-pip-version-check Pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os

          RES = 'android/app/src/main/res'
          SRC = 'resources/android-icon'
          BG_HEX = '#031837'

          # (densidad, tamaño del ícono clásico en px, tamaño del lienzo
          # adaptativo de 108dp en px) — la relación es siempre 108/48 por
          # densidad, tal como Capacitor genera sus propios mipmap por
          # defecto.
          DENSIDADES = [
              ('mdpi', 48, 108),
              ('hdpi', 72, 162),
              ('xhdpi', 96, 216),
              ('xxhdpi', 144, 324),
              ('xxxhdpi', 192, 432),
          ]

          legacy = Image.open(f'{SRC}/legacy-master.png').convert('RGBA')
          foreground = Image.open(f'{SRC}/foreground-master.png').convert('RGBA')

          def circular(im):
              mascara = Image.new('L', im.size, 0)
              ImageDraw.Draw(mascara).ellipse([0, 0, im.size[0] - 1, im.size[1] - 1], fill=255)
              redondo = Image.new('RGBA', im.size, (0, 0, 0, 0))
              redondo.paste(im, (0, 0), mascara)
              return redondo

          for densidad, tam_legacy, tam_adaptativo in DENSIDADES:
              carpeta = f'{RES}/mipmap-{densidad}'
              os.makedirs(carpeta, exist_ok=True)

              cuadrado = legacy.resize((tam_legacy, tam_legacy), Image.LANCZOS)
              cuadrado.save(f'{carpeta}/ic_launcher.png')
              circular(cuadrado).save(f'{carpeta}/ic_launcher_round.png')

              fg = foreground.resize((tam_adaptativo, tam_adaptativo), Image.LANCZOS)
              fg.save(f'{carpeta}/ic_launcher_foreground.png')

          # Color de fondo del ícono adaptativo — el mismo marino exacto
          # del logo, no el azul genérico que trae Capacitor por defecto.
          with open(f'{RES}/values/ic_launcher_background.xml', 'w', encoding='utf-8') as f:
              f.write(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  f'    <color name="ic_launcher_background">{BG_HEX}</color>\n'
                  '</resources>\n'
              )

          print('Ícono del lanzador generado en las 5 densidades.')
          PY

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: technoverse-admin-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
