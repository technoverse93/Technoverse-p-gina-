<!doctype html>
<html lang="es" class="tv-ventanita">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Misma política que index.html: solo código propio; datos solo con Supabase. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co data: blob:;" />
    <meta name="robots" content="noindex" />
    <title>Jarvis</title>

    <!-- Ventanita del mini-widget de Jarvis (src/rapido.tsx). El fondo es
         transparente: detrás se ve la pantalla de inicio del teléfono. La
         hoja de abajo se pinta YA, antes de que llegue el código, para que
         el toque al widget tenga respuesta inmediata. -->
    <style>
      html.tv-ventanita, html.tv-ventanita body { background: transparent !important; background-image: none !important; margin: 0; }
      .vj-pre { position: fixed; left: 8px; right: 8px; top: calc(clamp(10px, 9vh, 72px) + env(safe-area-inset-top, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); border-radius: 22px; background: #fff; box-shadow: 0 24px 60px rgba(0, 0, 0, .3); display: grid; grid-template-rows: 46px 1fr; overflow: hidden; font-family: system-ui, sans-serif; }
      .vj-pre-cab { display: flex; align-items: center; padding: 0 14px; font-size: 14px; font-weight: 600; color: #0f2a2e; background: #EAF2F3; border-bottom: 1px solid #D6E3E4; }
      .vj-pre-puntos { display: flex; gap: 8px; align-items: center; justify-content: center; }
      .vj-pre-puntos i { width: 8px; height: 8px; border-radius: 50%; background: #0C6C78; animation: vj-pre 1.1s ease-in-out infinite; }
      .vj-pre-puntos i:nth-child(2) { animation-delay: .15s; }
      .vj-pre-puntos i:nth-child(3) { animation-delay: .3s; }
      @keyframes vj-pre { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      @media (prefers-color-scheme: dark) {
        .vj-pre { background: #161B19; }
        .vj-pre-cab { background: #1D2421; color: #E7EFEC; border-bottom-color: #26302C; }
        .vj-pre-puntos i { background: #4FD1C5; }
      }
      @media (min-width: 640px) { .vj-pre { left: 0; right: 0; margin: 0 auto; width: min(520px, calc(100vw - 32px)); } }
      @media (prefers-reduced-motion: reduce) { .vj-pre-puntos i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="vj-pre" aria-hidden="true"><div class="vj-pre-cab">Jarvis</div><div class="vj-pre-puntos"><i></i><i></i><i></i></div></div></div>
    <script type="module" src="/src/rapido.tsx"></script>
  </body>
</html>
