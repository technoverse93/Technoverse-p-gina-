<!doctype html>
<html lang="es" class="tv-ventanita">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Misma política que index.html: solo código propio; datos solo con Supabase. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://huggingface.co https://*.huggingface.co https://*.hf.co https://cdnjs.cloudflare.com https://cdn.jsdelivr.net data: blob:; media-src 'self' blob: data:; worker-src 'self' blob:;" />
    <meta name="robots" content="noindex" />
    <title>Javier</title>

    <!-- Ventanita del mini-widget de Javier (src/rapido.tsx). El fondo es
         transparente: detrás sigue a la vista lo que había (la pantalla de
         inicio, YouTube…). Mientras llega el código se pinta YA una pastillita
         abajo, para que el llamado tenga respuesta inmediata SIN tapar nada
         (antes era una hoja grande que cubría casi toda la pantalla). -->
    <style>
      html.tv-ventanita, html.tv-ventanita body { background: transparent !important; background-image: none !important; margin: 0; }
      .vj-pre { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); height: 48px; padding: 0 20px; border-radius: 999px; background: rgba(234, 242, 243, .94); box-shadow: 0 10px 30px rgba(0, 0, 0, .28); display: flex; align-items: center; gap: 14px; font-family: system-ui, sans-serif; }
      .vj-pre-cab { font-size: 14px; font-weight: 600; color: #0f2a2e; }
      .vj-pre-puntos { display: flex; gap: 7px; align-items: center; }
      .vj-pre-puntos i { width: 8px; height: 8px; border-radius: 50%; background: #0C6C78; animation: vj-pre 1.1s ease-in-out infinite; }
      .vj-pre-puntos i:nth-child(2) { animation-delay: .15s; }
      .vj-pre-puntos i:nth-child(3) { animation-delay: .3s; }
      @keyframes vj-pre { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      @media (prefers-color-scheme: dark) {
        .vj-pre { background: rgba(22, 27, 25, .94); }
        .vj-pre-cab { color: #E7EFEC; }
        .vj-pre-puntos i { background: #4FD1C5; }
      }
      @media (prefers-reduced-motion: reduce) { .vj-pre-puntos i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="vj-pre" aria-hidden="true"><div class="vj-pre-cab">Javier</div><div class="vj-pre-puntos"><i></i><i></i><i></i></div></div></div>
    <script type="module" src="/src/rapido.tsx"></script>
  </body>
</html>
